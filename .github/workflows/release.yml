name: Release

# Builds a WoW-installable TurmoilsAddon-<version>.zip.
#
# - Every push to main auto-bumps the PATCH version (X.Y.Z -> X.Y.(Z+1)) from
#   the latest published release, commits that bump into TurmoilsAddon.toc,
#   tags it, and publishes a GitHub Release with the zip attached. There is
#   no manual "git tag" step -- pushing to main IS the release.
# - Run this workflow manually (Actions tab -> Release -> Run workflow) to
#   just produce a downloadable build artifact without publishing anything --
#   e.g. to sanity-check a branch before merging it to main.
#
# Adapted from ReforgedBreakTimer's release.yml. Simpler in one way: this
# addon's libraries live under lib/ and are listed in the .toc like any
# other file, so (unlike that workflow) there's no separate "also copy
# images/textures" step - staging the .toc's own file list is the whole job.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on a manual test build (e.g. 1.1.0). Leave blank to preview the next auto-bumped patch version without publishing anything."
        required: false
        default: ""

env:
  ADDON_NAME: TurmoilsAddon

jobs:
  validate:
    name: Validate Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own lua5.1 package -- ships lua5.1/luac5.1 under those exact
      # names (unlike some third-party setup actions, which install generic
      # lua/luac and break scripts written for the versioned names).
      - name: Install Lua 5.1 and luacheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck

      - name: Syntax-check every .lua file
        run: |
          set -euo pipefail
          # lib/ is excluded: LibWindow-1.1.lua ships with a UTF-8 BOM the
          # WoW client tolerates but standalone luac chokes on.
          while IFS= read -r -d '' f; do
            echo "luac5.1 -p $f"
            luac5.1 -p "$f"
          done < <(find . -name "*.lua" -not -path "./lib/*" -print0)

      - name: Lint with luacheck
        run: luacheck "${ADDON_NAME}.lua" constants core features tests

      - name: Run the test suite
        run: lua5.1 tests/run.lua

  release:
    name: Bump version and publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A manual test run can pin an exact version to preview; otherwise
          # (both for a real push-to-main release AND for an unpinned manual
          # test run) the next version is always the latest published
          # release's patch version, bumped by one.
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -z "${LATEST_TAG:-}" ]; then
              # No release has ever been published -- fall back to whatever
              # version is currently committed in the .toc as the baseline.
              LATEST_TAG="v$(grep -oP '(?<=## Version: ).*' "${ADDON_NAME}.toc" | tr -d '\r')"
            fi

            BASE="${LATEST_TAG#v}"
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            MAJOR="${MAJOR:-0}"
            MINOR="${MINOR:-0}"
            PATCH="${PATCH:-0}"
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

            echo "Latest published release: $LATEST_TAG"
          fi

          IS_RELEASE=false
          if [ "${{ github.event_name }}" = "push" ]; then
            IS_RELEASE=true
          fi

          echo "Building version $VERSION (publish: $IS_RELEASE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Bump version in the .toc and commit it
        if: steps.version.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          sed -i "s/^## Version:.*/## Version: ${{ steps.version.outputs.version }}/" "${ADDON_NAME}.toc"

          if git diff --quiet -- "${ADDON_NAME}.toc"; then
            echo "Version already up to date, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${ADDON_NAME}.toc"
            git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
            # Uses the default GITHUB_TOKEN, so this push does not itself
            # trigger another workflow run (GitHub suppresses that by design).
            git push origin HEAD:main
          fi

      - name: Stage addon files
        run: |
          set -euo pipefail
          STAGE="dist/${ADDON_NAME}"
          mkdir -p "$STAGE"

          # Ship exactly what scripts/deploy_to_wow.ps1 deploys locally: the
          # .toc plus every file it lists (source, constants/core/features,
          # and the lib/ libraries) - nothing from tests/, scripts/, or
          # .github/.
          cp "${ADDON_NAME}.toc" "$STAGE/"
          # The `|| [ -n "$line" ]` clause is required: without it, `read`
          # silently skips a final line that has no trailing newline. The
          # .toc uses Windows-style backslash separators (constants\...,
          # lib\LibStub\...); normalize to forward slashes since this job
          # runs on a Linux runner.
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            line="${line//\\//}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            mkdir -p "$STAGE/$(dirname "$line")"
            cp "$line" "$STAGE/$line"
          done < "${ADDON_NAME}.toc"

          # Fail loudly if a listed file didn't make it into the package,
          # rather than shipping a broken zip.
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            line="${line//\\//}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            if [ ! -f "$STAGE/$line" ]; then
              echo "::error::$line is listed in ${ADDON_NAME}.toc but is missing from the staged package"
              exit 1
            fi
          done < "${ADDON_NAME}.toc"

          # Stamp the packaged .toc with the version being built, in case the
          # commit step above was skipped (e.g. an unpublished test build).
          sed -i "s/^## Version:.*/## Version: ${{ steps.version.outputs.version }}/" "$STAGE/${ADDON_NAME}.toc"

      - name: Zip it
        run: |
          set -euo pipefail
          cd dist
          zip -rq "../${ADDON_NAME}-${{ steps.version.outputs.version }}.zip" "${ADDON_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ADDON_NAME }}-${{ steps.version.outputs.version }}
          path: ${{ env.ADDON_NAME }}-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ env.ADDON_NAME }}-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
